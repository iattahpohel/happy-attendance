<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video demo · Happy Attendance</title>
<meta name="description" content="Video demo 2 phút giới thiệu Happy Attendance: check-in, hành trình, thành tựu, Wrapped, cộng đồng và trang quản trị.">
<meta property="og:title" content="Video demo · Happy Attendance">
<meta property="og:description" content="Mỗi ngày đi làm, một niềm vui nhỏ. Xem demo ứng dụng trong 2 phút.">
<meta property="og:image" content="media/happy-attendance-demo-poster.jpg">
<style>
:root{--cream:#fff8ee;--ink:#2f2a24;--muted:#8a8075;--line:#f0e6d8;--sun:#ffc94a;--sun-soft:#fff1c7;--sky-soft:#ddf0fb}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;font-family:Nunito,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(180deg,var(--sky-soft),var(--cream) 380px);color:var(--ink);line-height:1.6}
.wrap{max-width:960px;margin:0 auto;padding:40px 16px 56px;text-align:center}
.eyebrow{display:inline-block;background:var(--sun-soft);border-radius:999px;padding:4px 14px;font-weight:800;font-size:13px}
h1{font-size:clamp(28px,5.5vw,46px);line-height:1.15;margin:16px 0 8px;font-weight:900;letter-spacing:-.02em}
p.lead{margin:0 auto 28px;max-width:600px;color:#5d544a;font-size:17px}
.player{border-radius:24px;overflow:hidden;background:#000;box-shadow:0 18px 50px -18px rgb(120 90 40/.45);border:1px solid var(--line)}
video{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#000}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-block;border-radius:16px;padding:12px 22px;font-weight:800;text-decoration:none;color:inherit}
.btn.primary{background:var(--ink);color:#fff}.btn.soft{background:#fff;border:1px solid var(--line)}
footer{margin-top:36px;color:var(--muted);font-size:14px;font-weight:700}
footer a{color:inherit}
</style>
</head>
<body>
<main class="wrap">
  <span class="eyebrow">🎬 Video demo</span>
  <h1>Happy Attendance trong 2 phút</h1>
  <p class="lead">Từ check-in một chạm, hành trình, thành tựu, Wrapped cuối tháng, cộng đồng đến trang quản trị dành cho HR.</p>
  <div class="player">
    <video controls playsinline preload="metadata" poster="media/happy-attendance-demo-poster.jpg">
      <source src="media/happy-attendance-demo.mp4" type="video/mp4">
      Trình duyệt của bạn không hỗ trợ phát video.
    </video>
  </div>
  <div class="cta"><a class="btn primary" href="./">Mở ứng dụng</a><a class="btn soft" href="hdsd">Hướng dẫn sử dụng</a></div>
  <footer>Happy Attendance · <a href="promo">Giới thiệu</a> · <a href="hdsd">Hướng dẫn sử dụng</a></footer>
</main>
</body>
</html>
